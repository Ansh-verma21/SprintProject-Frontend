<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'Member ' + member.memberNumber + ' — Detail'}">Member Detail</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #F9F7F7;
            --soft-blue: #DBE2EF;
            --accent: #3F72AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            color: #1a2a3a;
        }

        header {
            background: var(--soft-blue);
            padding: 20px 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid var(--accent);
        }

        .back-btn {
            text-decoration: none;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--cream);
        }

        .content {
            max-width: 1000px;
            margin: 40px auto;
            padding: 40px;
            background: var(--soft-blue);
            border-radius: 20px;
        }

        .table-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .left-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }

        .add-btn {
            background: var(--accent);
            color: white;
        }

        .search-btn {
            background: var(--cream);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .filter {
            background: var(--cream);
            border: 1px solid var(--accent);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            color: var(--accent);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--cream);
            border-radius: 12px;
            overflow: hidden;
        }

        .data-table th {
            background: var(--accent);
            color: white;
            padding: 14px;
            text-align: left;
            font-size: 0.8rem;
        }

        .data-table td {
            padding: 14px;
            border-top: 1px solid var(--soft-blue);
        }

        .edit-row {
            color: var(--accent);
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>

<body>

<header>
    <a th:href="@{/}" class="back-btn">← Back</a>
    <h2 style="color: var(--accent);">Member Detail</h2>
</header>

<div class="content">

    <div class="table-title" th:text="${member.tableName}">Customer</div>

    <!-- ACTION BAR (restored properly) -->
    <div class="actions">

        <div class="left-actions">
            <button class="btn add-btn">+ Add Customer</button>
            <button class="btn search-btn">🔍 Search Customer</button>
        </div>

        <!-- FILTER DROPDOWN (unchanged) -->
        <select class="filter">
            <option selected>Delhi</option>
            <option>Mumbai</option>
            <option>Bangalore</option>
            <option>Chennai</option>
            <option>Kolkata</option>
            <option>Pune</option>
            <option>Hyderabad</option>
            <option>Jaipur</option>
            <option>Lucknow</option>
            <option>Ahmedabad</option>
        </select>

    </div>

    <!-- TABLE (hardcoded kept as requested) -->
    <div class="table-wrapper">
        <table class="data-table">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>John Doe</td>
                    <td>Active</td>
                    <td>User</td>
                    <td class="edit-row">✎ Edit</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Jane Smith</td>
                    <td>Inactive</td>
                    <td>Admin</td>
                    <td class="edit-row">✎ Edit</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Alex Brown</td>
                    <td>Active</td>
                    <td>Manager</td>
                    <td class="edit-row">✎ Edit</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>Chris Evans</td>
                    <td>Pending</td>
                    <td>Staff</td>
                    <td class="edit-row">✎ Edit</td>
                </tr>
            </tbody>

        </table>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'Member ' + member.memberNumber + ' — Detail'}">Member Detail</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream:     #F9F7F7;
            --soft-blue: #DBE2EF;
            --accent:    #3F72AF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            color: #1a2a3a;
        }

        header {
            background: var(--soft-blue);
            padding: 20px 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid var(--accent);
        }

        .back-btn {
            text-decoration: none;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--cream);
            font-size: 0.85rem;
        }

        .content {
            max-width: 1060px;
            margin: 40px auto;
            padding: 40px;
            background: var(--soft-blue);
            border-radius: 20px;
        }

        .table-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 28px;
            color: var(--accent);
        }

        .action-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-wrap {
            position: relative;
            max-width: 320px;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 34px;
            border-radius: 999px;
            border: 1.5px solid var(--accent);
            background: var(--cream);
        }

        .add-btn {
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
        }

        .table-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .filter-select {
            border: 1.5px solid var(--accent);
            border-radius: 999px;
            padding: 8px 14px;
        }

        /* TABLE */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--cream);
            border-radius: 12px;
            overflow: hidden;
        }

        .data-table th,
        .data-table td {
            text-align: center;
            padding: 14px;
        }

        .data-table th {
            background: var(--accent);
            color: white;
            font-size: 0.78rem;
            text-transform: uppercase;
        }

        .data-table td {
            border-top: 1px solid var(--soft-blue);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
        }

        .badge-active {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .edit-cell {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--accent);
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
        }

    </style>
</head>

<body>

<header>
    <a th:href="@{/}" class="back-btn">← Back</a>
    <h2 style="color: var(--accent); font-family: 'Playfair Display', serif;">Member Detail</h2>
</header>

<div class="content">

    <div class="table-title" th:text="${member.tableName}">Customer</div>

    <!-- SEARCH -->
    <div class="action-bar">
        <form th:action="@{/member/{id}/search(id=${member.memberNumber})}" method="get" class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" name="query" class="search-input"
                   placeholder="Search customer…" th:value="${searchQuery}" />
        </form>

        <button class="add-btn">+ Add Customer</button>
    </div>

    <!-- FILTER -->
    <div class="table-header-row">
        <span>All Customers</span>

        <form th:action="@{/member/{id}(id=${member.memberNumber})}" method="post">
            <select name="city" class="filter-select"
                    onchange="this.form.submit()">

                <option value="" th:selected="${searchMode}">All Cities</option>

                <option th:each="city : ${cities}"
                        th:value="${city}"
                        th:text="${city}"
                        th:selected="${!searchMode and city == selectedCity}">
                </option>

            </select>
        </form>
    </div>

    <!-- TABLE -->
    <table class="data-table">

        <thead>
        <tr>
            <th>S. No.</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="c, stat : ${customers}">
            <td th:text="${stat.index + 1}"></td>
            <td th:text="${c.fullName}"></td>
            <td th:text="${c.email}"></td>
            <td>
                <span th:if="${c.active}" class="badge badge-active">Active</span>
                <span th:unless="${c.active}" class="badge badge-inactive">Inactive</span>
            </td>
            <td>
                <span class="edit-cell">
                    <svg width="13" height="13" viewBox="0 0 20 20" fill="none">
                        <path d="M14.85 2.15a2 2 0 0 1 2.83 2.83L6.5 16.16l-4 1 1-4L14.85 2.15z"
                              stroke="#3F72AF" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Edit
                </span>
            </td>
        </tr>

        <tr th:if="${customers != null and #lists.isEmpty(customers)}">
            <td colspan="5">
                <div class="empty-state">

                    <p th:if="${searchMode}">
                        No results found for "<span th:text="${searchQuery}"></span>"
                    </p>

                    <p th:unless="${searchMode}">
                        No customers in <span th:text="${selectedCity}"></span>
                    </p>

                </div>
            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>

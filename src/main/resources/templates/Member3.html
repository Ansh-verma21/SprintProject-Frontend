<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'Member ' + member.memberNumber + ' — Detail'}">Member Detail</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --cream: #F9F7F7;
            --soft-blue: #DBE2EF;
            --accent: #3F72AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            color: #1a2a3a;
        }

        header {
            background: var(--soft-blue);
            padding: 20px 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid var(--accent);
        }

        .back-btn {
            text-decoration: none;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--cream);
            font-size: 0.85rem;
        }

        .content {
            max-width: 1060px;
            margin: 40px auto;
            padding: 40px;
            background: var(--soft-blue);
            border-radius: 20px;
        }

        .table-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 28px;
            color: var(--accent);
        }

        .action-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-wrap {
            position: relative;
            max-width: 320px;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 34px;
            border-radius: 999px;
            border: 1.5px solid var(--accent);
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            outline: none;
        }

        .search-input:focus {
            box-shadow: 0 0 0 3px rgba(63, 114, 175, 0.14);
        }

        .add-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            background: var(--accent);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        .add-btn:hover {
            opacity: 0.88;
        }

        .table-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .table-sub-label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
        }

        /* ── CITY COMBOBOX ── */
        .city-combobox {
            position: relative;
            min-width: 220px;
        }

        .city-input-wrap {
            position: relative;
        }

        .city-search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .city-search-input {
            width: 100%;
            padding: 9px 16px 9px 34px;
            border: 1.5px solid var(--accent);
            border-radius: 999px;
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            color: #1a2a3a;
            outline: none;
            transition: box-shadow 0.18s;
        }

        .city-search-input:focus {
            box-shadow: 0 0 0 3px rgba(63, 114, 175, 0.14);
        }

        .city-search-input::placeholder {
            color: #7a8fa6;
        }

        /* floating suggestions */
        .city-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            max-height: 240px;
            /* ~10 rows */
            overflow-y: auto;
            background: #fff;
            border: 1.5px solid var(--accent);
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(63, 114, 175, 0.13);
            z-index: 999;
            padding: 4px 0;
        }

        .city-dropdown.open {
            display: block;
        }

        .city-option {
            padding: 9px 16px;
            font-size: 0.84rem;
            color: #1a2a3a;
            cursor: pointer;
            transition: background 0.1s;
        }

        .city-option:hover {
            background: rgba(63, 114, 175, 0.09);
            color: var(--accent);
        }

        .city-option.active-opt {
            background: rgba(63, 114, 175, 0.13);
            color: var(--accent);
            font-weight: 600;
        }

        .city-no-results {
            padding: 12px 16px;
            font-size: 0.82rem;
            color: #7a8fa6;
            text-align: center;
        }

        /* TABLE */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--cream);
            border-radius: 12px;
            overflow: hidden;
        }

        .data-table th,
        .data-table td {
            text-align: center;
            padding: 14px;
        }

        .data-table th {
            background: var(--accent);
            color: white;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .data-table td {
            border-top: 1px solid var(--soft-blue);
            font-size: 0.87rem;
        }

        .data-table tbody tr:hover td {
            background: rgba(219, 226, 239, 0.45);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-active {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .customer-name-link {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1.5px solid transparent;
            transition: border-color 0.18s, color 0.18s;
        }

        .customer-name-link:hover {
            border-bottom-color: var(--accent);
            color: #2c5490;
        }

        .edit-cell {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #4a5a6a;
            font-size: 0.88rem;
        }

        .empty-state .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <header>
        <a th:href="@{/}" class="back-btn">← Back</a>
        <h2 style="color: var(--accent); font-family: 'Playfair Display', serif;">Member Detail</h2>
    </header>

    <div class="content">

        <div class="table-title" th:text="${member.tableName}">Customer</div>

        <!-- ACTION BAR -->
        <div class="action-bar">
            <form th:action="@{/member/{id}/search(id=${member.memberNumber})}" method="get" class="search-wrap">
                <span class="search-icon">
                    <svg width="13" height="13" viewBox="0 0 20 20" fill="none">
                        <circle cx="9" cy="9" r="7" stroke="#3F72AF" stroke-width="2" />
                        <line x1="14.5" y1="14.5" x2="19" y2="19" stroke="#3F72AF" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </span>
                <input type="text" name="query" class="search-input" placeholder="Search customer…"
                    th:value="${searchQuery}" autocomplete="off" />
            </form>

            <a th:href="@{/member/3/add-customer}" class="add-btn">+ Add Customer</a>
        </div>

        <!-- TABLE HEADER ROW -->
        <div class="table-header-row">
            <span class="table-sub-label">All Customers</span>

            <!-- hidden form submitted by JS when a city is picked -->
            <form th:action="@{/member/{id}(id=${member.memberNumber})}" method="post" id="cityForm">
                <input type="hidden" id="cityHidden" name="city" th:value="${selectedCity}" />
                <input type="hidden" id="pageHidden" name="cityPage" th:value="${cityPage}" />
                <input type="hidden" name="pageNav" value="false" />
            </form>

            <!-- GOOGLE-STYLE CITY COMBOBOX -->
            <div class="city-combobox" id="cityCombobox">
                <div class="city-input-wrap">
                    <span class="city-search-icon">
                        <svg width="13" height="13" viewBox="0 0 20 20" fill="none">
                            <circle cx="9" cy="9" r="7" stroke="#3F72AF" stroke-width="2" />
                            <line x1="14.5" y1="14.5" x2="19" y2="19" stroke="#3F72AF" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                    </span>
                    <input type="text" id="citySearchInput" class="city-search-input" placeholder="Search city…"
                        autocomplete="off" th:value="${!searchMode and selectedCity != '' ? selectedCity : ''}" />
                </div>
                <div class="city-dropdown" id="cityDropdown"></div>
            </div>
        </div>

        <!-- TABLE -->
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c, stat : ${customers}">
                    <td th:text="${stat.index + 1}"></td>
                    <td>
                        <a th:href="@{/member/3/customer(
                        firstName=${c.fullName.split(' ')[0]},
                        lastName=${c.fullName.split(' ').length > 1 ? c.fullName.split(' ')[1] : ''})}"
                            class="customer-name-link" th:text="${c.fullName}">Mary Smith</a>
                    </td>
                    <td th:text="${c.email}"></td>
                    <td>
                        <span th:if="${c.active}" class="badge badge-active">Active</span>
                        <span th:unless="${c.active}" class="badge badge-inactive">Inactive</span>
                    </td>
                    <td>
                        <a th:href="@{/member/3/edit-customer(firstName=${c.fullName.split(' ')[0]}, lastName=${c.fullName.split(' ')[1]})}"
                            class="edit-cell" style="text-decoration:none;">
                            <svg width="13" height="13" viewBox="0 0 20 20" fill="none">
                                <path d="M14.85 2.15a2 2 0 0 1 2.83 2.83L6.5 16.16l-4 1 1-4L14.85 2.15z"
                                    stroke="#3F72AF" stroke-width="1.8" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            Edit
                        </a>
                    </td>
                </tr>
                <tr th:if="${customers != null and #lists.isEmpty(customers)}">
                    <td colspan="5">
                        <div class="empty-state">
                            <div class="icon">🔍</div>
                            <p>No records found.</p>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var allCities = /*[[${cities}]]*/[];
        var selCity = /*[[${selectedCity}]]*/ '';
        var isSearchMode = /*[[${searchMode}]]*/ false;
        var cityPage = /*[[${cityPage}]]*/ 0;

        var input = document.getElementById('citySearchInput');
        var dropdown = document.getElementById('cityDropdown');
        var combobox = document.getElementById('cityCombobox');
        var form = document.getElementById('cityForm');
        var cityHid = document.getElementById('cityHidden');
        var pageHid = document.getElementById('pageHidden');

        function showSuggestions(query) {
            dropdown.innerHTML = '';
            query = query.trim().toLowerCase();

            // filter: cities that CONTAIN the typed text anywhere
            var matches = allCities.filter(function (c) {
                return query === '' || c.toLowerCase().includes(query);
            });

            if (matches.length === 0) {
                var el = document.createElement('div');
                el.className = 'city-no-results';
                el.textContent = 'No cities found';
                dropdown.appendChild(el);
            } else {
                matches.forEach(function (city) {
                    var el = document.createElement('div');
                    el.className = 'city-option' + (city === selCity && !isSearchMode ? ' active-opt' : '');
                    el.textContent = city;
                    el.addEventListener('mousedown', function (e) {
                        e.preventDefault(); // prevent blur before click
                        cityHid.value = city;
                        pageHid.value = cityPage;
                        form.submit();
                    });
                    dropdown.appendChild(el);
                });
            }

            dropdown.classList.add('open');
        }

        input.addEventListener('input', function () {
            showSuggestions(this.value);
        });

        input.addEventListener('focus', function () {
            showSuggestions(this.value);
        });

        input.addEventListener('blur', function () {
            // small delay so mousedown on option fires first
            setTimeout(function () {
                dropdown.classList.remove('open');
                // restore selected city label if user blurred without picking
                if (!isSearchMode && selCity) input.value = selCity;
                else if (isSearchMode) input.value = '';
            }, 150);
        });

        document.addEventListener('click', function (e) {
            if (!combobox.contains(e.target)) {
                dropdown.classList.remove('open');
            }
        });
        /*]]>*/
    </script>

</body>

</html>

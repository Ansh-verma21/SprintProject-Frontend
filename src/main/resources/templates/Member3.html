<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'Member ' + member.memberNumber + ' — Detail'}">Member 3 — Detail</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --cream: #F9F7F7;
            --soft-blue: #DBE2EF;
            --accent: #3F72AF;
            --text-dark: #1a2a3a;
            --text-mid: #4a5a6a;
            --shadow: 0 8px 32px rgba(63, 114, 175, 0.10);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--cream);
            font-family: 'DM Sans', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* ── HEADER ───────────────────────────────────────────── */
        header {
            background: var(--cream);
            border-bottom: 2px solid var(--soft-blue);
            padding: 28px 60px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 0.06em;
            padding: 8px 16px;
            border: 1.5px solid var(--soft-blue);
            border-radius: 20px;
            transition: background 0.2s, border-color 0.2s;
        }

        .back-btn:hover {
            background: var(--soft-blue);
            border-color: var(--accent);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 700;
            color: var(--text-dark);
        }

        /* ── HERO BANNER ─────────────────────────────────────── */
        .hero {
            background: var(--soft-blue);
            padding: 56px 60px 0;
            display: flex;
            align-items: flex-end;
            gap: 48px;
            max-width: 1100px;
            margin: 48px auto 0;
            border-radius: 24px 24px 0 0;
            overflow: hidden;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(63, 114, 175, 0.08);
        }

        .hero-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--cream);
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(63, 114, 175, 0.18);
        }

        .hero-avatar-placeholder {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--cream);
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #fff;
            flex-shrink: 0;
        }

        .hero-info {
            padding-bottom: 32px;
        }

        .hero-tag {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--cream);
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 14px;
        }

        .hero-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 3.5vw, 2.8rem);
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.15;
            margin-bottom: 8px;
        }

        .hero-sub {
            font-size: 0.9rem;
            color: var(--text-mid);
            font-weight: 300;
        }

        /* ── CONTENT AREA ──────────────────────────────────────── */
        .content-wrap {
            max-width: 1100px;
            margin: 0 auto 80px;
            background: var(--cream);
            border: 1.5px solid var(--soft-blue);
            border-top: none;
            border-radius: 0 0 24px 24px;
            padding: 48px 60px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 20px;
        }

        /* info grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 48px;
        }

        .info-card {
            background: var(--soft-blue);
            border-radius: 14px;
            padding: 22px 24px;
        }

        .info-card label {
            display: block;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .info-card .value {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* placeholder message */
        .placeholder-box {
            background: var(--soft-blue);
            border-radius: 16px;
            padding: 40px 36px;
            text-align: center;
            border: 2px dashed var(--accent);
        }

        .placeholder-box .big-num {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent);
            opacity: 0.35;
            line-height: 1;
            margin-bottom: 12px;
        }

        .placeholder-box p {
            font-size: 0.95rem;
            color: var(--text-mid);
            font-weight: 300;
            line-height: 1.6;
        }

        .placeholder-box strong {
            color: var(--accent);
            font-weight: 500;
        }

        /* ── RESPONSIVE ───────────────────────────────────────── */
        @media (max-width: 800px) {
            header {
                padding: 20px 24px;
            }

            .hero {
                padding: 40px 28px 0;
                flex-direction: column;
                gap: 20px;
            }

            .content-wrap {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

    <!-- ── HEADER ──────────────────────────────────────────────────────── -->
    <header>
        <a th:href="@{/}" class="back-btn">&#8592; Back</a>
        <h1>Member Detail</h1>
    </header>

    <!--
    Controller sets model attribute "member" as MemberDTO.
    This page is only reachable for member 3 (controller guards it).
-->

    <!-- ── HERO ────────────────────────────────────────────────────────── -->
    <div class="hero" style="max-width:1100px; margin: 48px auto 0;">
        <!-- Avatar -->
        <img th:if="${member.imageUrl != null and !member.imageUrl.isEmpty()}" th:src="${member.imageUrl}"
            th:alt="${member.name}" class="hero-avatar" />
        <div th:unless="${member.imageUrl != null and !member.imageUrl.isEmpty()}" class="hero-avatar-placeholder"
            th:text="${member.name != null ? member.name.substring(0,1) : '3'}">
        </div>

        <div class="hero-info">
            <span class="hero-tag" th:text="${'Member #' + member.memberNumber}">Member #3</span>
            <div class="hero-name" th:text="${member.name}">Member Name</div>
            <div class="hero-sub" th:text="${'Working on: ' + member.tableName}">Working on: table name</div>
        </div>
    </div>

    <!-- ── DETAIL CONTENT ───────────────────────────────────────────────── -->
    <div class="content-wrap">

        <p class="section-title">Overview</p>

        <div class="info-grid">
            <div class="info-card">
                <label>Member Number</label>
                <div class="value" th:text="${member.memberNumber}">3</div>
            </div>
            <div class="info-card">
                <label>Name</label>
                <div class="value" th:text="${member.name}">—</div>
            </div>
            <div class="info-card">
                <label>Table / Module</label>
                <div class="value" th:text="${member.tableName}">—</div>
            </div>
        </div>

        <!-- Placeholder for API data from second server -->
        <p class="section-title">Data from Server API</p>
        <div class="placeholder-box">
            <div class="big-num">3</div>
            <p>
                This is the <strong>3rd Member's Detail Page</strong>.<br>
                API data fetched from the second PC (Spring Data REST server)<br>
                will be rendered here once the backend endpoint is connected.
            </p>
        </div>

    </div>

</body>

</html>

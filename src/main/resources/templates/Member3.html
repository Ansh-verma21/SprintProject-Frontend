<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'Member ' + member.memberNumber + ' — Detail'}">Member Detail</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream:     #F9F7F7;
            --soft-blue: #DBE2EF;
            --accent:    #3F72AF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            color: #1a2a3a;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            background: var(--soft-blue);
            padding: 20px 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid var(--accent);
        }

        .back-btn {
            text-decoration: none;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--cream);
            font-size: 0.85rem;
            transition: background 0.2s, color 0.2s;
        }
        .back-btn:hover { background: var(--accent); color: var(--cream); }

        /* ── MAIN CONTENT ── */
        .content {
            max-width: 1060px;
            margin: 40px auto;
            padding: 40px;
            background: var(--soft-blue);
            border-radius: 20px;
        }

        .table-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 28px;
            color: var(--accent);
        }

        /* ── TOP ACTION BAR ── */
        .action-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* Search capsule */
        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 180px;
            max-width: 320px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 9px 16px 9px 38px;
            border-radius: 999px;
            border: 1.5px solid var(--accent);
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            color: #1a2a3a;
            outline: none;
            cursor: text;
            transition: box-shadow 0.2s;
        }
        .search-input::placeholder { color: #8a9ab0; }
        .search-input:focus { box-shadow: 0 0 0 3px rgba(63,114,175,0.15); }

        /* Add Customer button */
        .add-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 18px;
            border-radius: 999px;
            border: none;
            background: var(--accent);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .add-btn:hover { opacity: 0.88; }

        .add-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            line-height: 1;
        }

        /* ── TABLE HEADER ROW (title + filter on same line) ── */
        .table-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .table-sub-label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
        }

        /* City filter (right side, no button) */
        .filter-form {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 0.78rem;
            color: #4a5a6a;
            white-space: nowrap;
        }

        .filter-select {
            background: var(--cream);
            border: 1.5px solid var(--accent);
            padding: 7px 14px;
            border-radius: 999px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            color: #1a2a3a;
            cursor: pointer;
            outline: none;
            min-width: 170px;
            transition: box-shadow 0.2s;
        }
        .filter-select:focus { box-shadow: 0 0 0 3px rgba(63,114,175,0.15); }

        /* result count */
        .result-count {
            font-size: 0.76rem;
            color: #4a5a6a;
            margin-bottom: 10px;
        }

        /* ── TABLE ── */
        .table-wrapper { overflow-x: auto; }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--cream);
            border-radius: 12px;
            overflow: hidden;
        }

        .data-table th {
            background: var(--accent);
            color: white;
            padding: 13px 18px;
            text-align: left;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .data-table td {
            padding: 13px 18px;
            border-top: 1px solid var(--soft-blue);
            font-size: 0.87rem;
        }

        .data-table tbody tr:hover td { background: rgba(219,226,239,0.45); }

        /* status badges */
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .badge-active   { background: #d1fae5; color: #065f46; }
        .badge-inactive { background: #fee2e2; color: #991b1b; }

        /* edit cell */
        .edit-cell {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }
        .edit-cell svg { flex-shrink: 0; }

        /* empty / hint states */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #4a5a6a;
        }
        .empty-state .icon { font-size: 2.2rem; margin-bottom: 10px; }
        .empty-state p     { font-size: 0.88rem; }
    </style>
</head>

<body>

<!-- HEADER -->
<header>
    <a th:href="@{/}" class="back-btn">← Back</a>
    <h2 style="color: var(--accent); font-family: 'Playfair Display', serif;">Member Detail</h2>
</header>

<div class="content">

    <!-- PAGE TITLE -->
    <div class="table-title" th:text="${member.tableName}">Customer</div>

    <!-- TOP ACTION BAR: Search + Add -->
    <div class="action-bar">

        <!-- Search capsule -->
        <div class="search-wrap">
            <span class="search-icon">
                <!-- magnifier SVG -->
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none"
                     xmlns="http://www.w3.org/2000/svg">
                    <circle cx="9" cy="9" r="7" stroke="#3F72AF" stroke-width="2"/>
                    <line x1="14.5" y1="14.5" x2="19" y2="19"
                          stroke="#3F72AF" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </span>
            <input type="text"
                   class="search-input"
                   placeholder="Search customer…" />
        </div>

        <!-- Add Customer -->
        <button class="add-btn">
            <span class="add-icon">+</span>
            Add Customer
        </button>

    </div>

    <!-- TABLE HEADER ROW: label (left) + city filter (right) -->
    <div class="table-header-row">
        <span class="table-sub-label">All Customers</span>

        <!-- City filter — auto-submits on change, no button -->
        <form id="cityForm"
              th:action="@{/member/{id}(id=${member.memberNumber})}"
              method="post"
              class="filter-form">

            <label class="filter-label" for="citySelect">City:</label>

            <select id="citySelect"
                    name="city"
                    class="filter-select"
                    onchange="document.getElementById('cityForm').submit()">

                <option th:each="city : ${cities}"
                        th:value="${city}"
                        th:text="${city}"
                        th:selected="${city == selectedCity}">
                </option>
            </select>
        </form>
    </div>

    <!-- RESULT COUNT -->
    <div th:if="${customers != null and not #lists.isEmpty(customers)}"
         class="result-count"
         th:text="${#lists.size(customers)} + ' customer(s) in ' + ${selectedCity}">
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
        <table class="data-table">

            <thead>
                <tr>
                    <th>#</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <!-- DATA ROWS -->
                <tr th:each="customer, stat : ${customers}">
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${customer.fullName}"></td>
                    <td th:text="${customer.email}"></td>
                    <td>
                        <span th:if="${customer.active}"  class="badge badge-active">Active</span>
                        <span th:unless="${customer.active}" class="badge badge-inactive">Inactive</span>
                    </td>
                    <td>
                        <span class="edit-cell">
                            <!-- pencil SVG -->
                            <svg width="13" height="13" viewBox="0 0 20 20" fill="none"
                                 xmlns="http://www.w3.org/2000/svg">
                                <path d="M14.85 2.15a2 2 0 0 1 2.83 2.83L6.5 16.16l-4 1 1-4L14.85 2.15z"
                                      stroke="#3F72AF" stroke-width="1.8"
                                      stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Edit
                        </span>
                    </td>
                </tr>

                <!-- EMPTY: city selected but no results -->
                <tr th:if="${customers != null and #lists.isEmpty(customers)}">
                    <td colspan="5">
                        <div class="empty-state">
                            <div class="icon">🔍</div>
                            <p>No customers found for <strong th:text="${selectedCity}"></strong>.</p>
                        </div>
                    </td>
                </tr>

            </tbody>
        </table>
    </div>

</div>

</body>
</html>

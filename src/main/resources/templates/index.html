<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Team</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --cream: #F9F7F7;
            --soft-blue: #DBE2EF;
            --accent: #3F72AF;
            --text-dark: #1a2a3a;
            --text-mid: #4a5a6a;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* ── HEADER ─────────────────────────────────────────────── */
        header {
            background: var(--cream);
            border-bottom: 2px solid var(--soft-blue);
            padding: 30px 60px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.3px;
        }

        header p {
            margin-left: auto;
            font-size: 0.82rem;
            color: var(--text-mid);
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        /* ── MAIN ───────────────────────────────────────────────── */
        main {
            max-width: 1060px;
            margin: 0 auto;
            padding: 52px 40px 80px;
        }

        .section-label {
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 28px;
        }

        /* ── 2 × 3 GRID ─────────────────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        /* ── CARD ───────────────────────────────────────────────── */
        .card {
            background: var(--cream);
            border: 1.5px solid var(--soft-blue);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(63, 114, 175, 0.08);
            transition: transform 0.26s ease,
                box-shadow 0.26s ease,
                border-color 0.26s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 40px rgba(63, 114, 175, 0.16);
            border-color: var(--accent);
        }

        /* top coloured strip */
        .card-strip {
            height: 5px;
            background: var(--soft-blue);
        }

        .card:hover .card-strip {
            background: linear-gradient(90deg, var(--soft-blue), var(--accent));
        }

        /* image */
        .card-img {
            height: 200px;
            background: var(--soft-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* fallback avatar initial */
        .avatar {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #fff;
        }

        /* body text */
        .card-body {
            padding: 22px 26px 18px;
        }

        .member-badge {
            display: inline-block;
            font-size: 0.67rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--soft-blue);
            padding: 3px 12px;
            border-radius: 20px;
            margin-bottom: 13px;
        }

        .card-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.22rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .card-rule {
            width: 32px;
            height: 2px;
            background: var(--soft-blue);
            border-radius: 2px;
            margin-bottom: 10px;
        }

        .card:hover .card-rule {
            background: var(--accent);
        }

        .card-table-label {
            font-size: 0.67rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .card-table-name {
            font-size: 0.86rem;
            color: var(--text-mid);
            font-weight: 400;
        }

        /* footer arrow */
        .card-footer {
            padding: 0 26px 20px;
            display: flex;
            justify-content: flex-end;
        }

        .arrow {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--soft-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--accent);
            transition: background 0.2s, color 0.2s;
        }

        .card:hover .arrow {
            background: var(--accent);
            color: #fff;
        }

        /* ── RESPONSIVE ─────────────────────────────────────────── */
        @media (max-width: 720px) {
            .grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 22px 24px;
            }

            main {
                padding: 36px 18px 60px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-dot"></div>
        <h1>Team Film Rental | Gp. - 6</h1>
        <p>6 Members</p>
    </header>

    <main>
        <p class="section-label">All Members</p>

        <div class="grid">

            <!--
            th:each loops over List<MemberDTO> passed by TeamController.
            MemberDTO fields: memberNumber (int), name, tableName, imageUrl (String)
        -->
            <div th:each="member : ${members}">

                <!-- ── Card 3: clickable → page 2 ── -->
                <a th:if="${member.memberNumber == 3}" th:href="@{/member/{id}(id=${member.memberNumber})}"
                    class="card">

                    <div class="card-strip"></div>

                    <div class="card-img">
                        <img th:if="${member.imageUrl != null and !member.imageUrl.isEmpty()}"
                            th:src="${member.imageUrl}" th:alt="${member.name}" />
                        <div th:unless="${member.imageUrl != null and !member.imageUrl.isEmpty()}" class="avatar"
                            th:text="${#strings.substring(member.name, 0, 1)}">
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="member-badge" th:text="${'Member ' + member.memberNumber}">Member 3</div>
                        <div class="card-name" th:text="${member.name}">Name</div>
                        <div class="card-rule"></div>
                        <div class="card-table-label">Working on</div>
                        <div class="card-table-name" th:text="${member.tableName}">table name</div>
                    </div>

                    <div class="card-footer">
                        <div class="arrow">&#8594;</div>
                    </div>
                </a>

                <!-- ── Cards 1,2,4,5,6: same look, no navigation ── -->
                <div th:unless="${member.memberNumber == 3}" class="card">

                    <div class="card-strip"></div>

                    <div class="card-img">
                        <img th:if="${member.imageUrl != null and !member.imageUrl.isEmpty()}"
                            th:src="${member.imageUrl}" th:alt="${member.name}" />
                        <div th:unless="${member.imageUrl != null and !member.imageUrl.isEmpty()}" class="avatar"
                            th:text="${#strings.substring(member.name, 0, 1)}">
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="member-badge" th:text="${'Member ' + member.memberNumber}">Member 1</div>
                        <div class="card-name" th:text="${member.name}">Name</div>
                        <div class="card-rule"></div>
                        <div class="card-table-label">Working on</div>
                        <div class="card-table-name" th:text="${member.tableName}">table name</div>
                    </div>

                    <div class="card-footer">
                        <div class="arrow">&#8594;</div>
                    </div>
                </div>

            </div><!-- end th:each wrapper -->

        </div><!-- .grid -->
    </main>

</body>

</html>

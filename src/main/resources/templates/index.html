<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Team</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        /* ===== YOUR CSS UNCHANGED ===== */
        :root {
            --cream: #F9F7F7;
            --soft-blue: #DBE2EF;
            --accent: #3F72AF;
            --text-dark: #1a2a3a;
            --text-mid: #4a5a6a;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
        }

        header {
            background: var(--cream);
            border-bottom: 2px solid var(--soft-blue);
            padding: 30px 60px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        header p {
            margin-left: auto;
            font-size: 0.82rem;
            color: var(--text-mid);
        }

        main {
            max-width: 1060px;
            margin: 0 auto;
            padding: 52px 40px 80px;
        }

        .section-label {
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 28px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .card {
            background: var(--cream);
            border: 1.5px solid var(--soft-blue);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(63, 114, 175, 0.08);
            transition: transform 0.26s ease, box-shadow 0.26s ease, border-color 0.26s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 40px rgba(63, 114, 175, 0.16);
            border-color: var(--accent);
        }

        .card-strip {
            height: 5px;
            background: var(--soft-blue);
        }

        .card:hover .card-strip {
            background: linear-gradient(90deg, var(--soft-blue), var(--accent));
        }

        .card-img {
            height: 500px;
            background: var(--soft-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
        }

        .card-body {
            padding: 22px 26px 18px;
        }

        .member-badge {
            display: inline-block;
            font-size: 0.67rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--soft-blue);
            padding: 3px 12px;
            border-radius: 20px;
            margin-bottom: 13px;
        }

        .card-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.22rem;
            font-weight: 600;
        }

        .card-rule {
            width: 32px;
            height: 2px;
            background: var(--soft-blue);
            margin: 10px 0;
        }

        .card-table-label {
            font-size: 0.67rem;
            text-transform: uppercase;
            color: var(--accent);
        }

        .card-table-name {
            font-size: 0.86rem;
            color: var(--text-mid);
        }

        .card-footer {
            padding: 0 26px 20px;
            display: flex;
            justify-content: flex-end;
        }

        .arrow {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--soft-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }
    </style>
</head>

<body>

<header>
    <div class="header-dot"></div>
    <h1>Team Film Rental | Gp. - 6</h1>
    <p>6 Members</p>
</header>

<main>
    <p class="section-label">All Members</p>

    <div class="grid">

        <div th:each="member : ${members}">

            <!-- clickable only member 3 -->
            <a th:if="${member.memberNumber == 3}"
               th:href="@{/member/{id}(id=${member.memberNumber})}"
               class="card">

                <div class="card-strip"></div>

                <div class="card-img">
                    <img th:if="${member.imageUrl != null and member.imageUrl != ''}"
                         th:src="${member.imageUrl}" />

                    <div th:unless="${member.imageUrl != null and member.imageUrl != ''}"
                         class="avatar"
                         th:text="${member.name.substring(0,1)}"></div>
                </div>

                <div class="card-body">
                    <div class="member-badge">Member [[${member.memberNumber}]]</div>
                    <div class="card-name" th:text="${member.name}"></div>
                    <div class="card-rule"></div>
                    <div class="card-table-label">Working on</div>
                    <div class="card-table-name" th:text="${member.tableName}"></div>
                </div>

                <div class="card-footer">
                    <div class="arrow">→</div>
                </div>
            </a>

            <!-- others -->
            <div th:if="${member.memberNumber != 3}" class="card">

                <div class="card-strip"></div>

                <div class="card-img">
                    <img th:if="${member.imageUrl != null and member.imageUrl != ''}"
                         th:src="${member.imageUrl}" />

                    <div th:unless="${member.imageUrl != null and member.imageUrl != ''}"
                         class="avatar"
                         th:text="${member.name.substring(0,1)}"></div>
                </div>

                <div class="card-body">
                    <div class="member-badge">Member [[${member.memberNumber}]]</div>
                    <div class="card-name" th:text="${member.name}"></div>
                    <div class="card-rule"></div>
                    <div class="card-table-label">Working on</div>
                    <div class="card-table-name" th:text="${member.tableName}"></div>
                </div>

                <div class="card-footer">
                    <div class="arrow">→</div>
                </div>

            </div>

        </div>

    </div>
</main>

</body>
</html>

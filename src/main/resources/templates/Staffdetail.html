<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --cream: #F9F7F7; --blue: #DBE2EF; --accent: #3F72AF; --dark: #1a2a3a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); }
        header { display:flex; align-items:center; gap:16px; padding:22px 40px; background: var(--blue); border-bottom:2px solid var(--accent); }
        .back-btn { color: var(--accent); border:1px solid var(--accent); padding:9px 16px; border-radius:22px; text-decoration:none; background:white; }
        .content { max-width: 960px; margin: 36px auto; padding: 34px; background:white; border-radius:24px; box-shadow: 0 18px 34px rgba(63,114,175,0.1); }
        .title { font-family:'Playfair Display', serif; font-size:2rem; color: var(--accent); margin-bottom: 18px; }
        .detail-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 24px; }
        .card { background: #f8fafc; border:1px solid #e2e8f0; border-radius: 18px; padding: 22px; }
        .label { font-size:0.78rem; text-transform:uppercase; letter-spacing:0.12em; color:#3f72af; margin-bottom:6px; }
        .value { font-size:1rem; color:#1f2937; }
        .status { display:inline-flex; padding: 6px 14px; border-radius:999px; font-size:0.8rem; font-weight:700; }
        .status-active { background:#d1fae5; color:#065f46; }
        .status-inactive { background:#fee2e2; color:#991b1b; }
        .actions { margin-top: 22px; display:flex; flex-wrap: wrap; gap: 12px; }
        .btn { padding: 12px 18px; border-radius:999px; border:none; cursor:pointer; font-weight:700; }
        .btn-edit { background: var(--accent); color:white; }
        .btn-toggle { background:#e2e8f0; color:var(--dark); }
        .btn-delete { background:#fda4af; color:#7f1d1d; }
        .message { padding: 16px 20px; border-radius: 18px; margin-bottom: 18px; background: #fee2e2; color: #7f1d1d; }
    </style>
</head>

<body>
<header>
    <a th:href="@{/member/4}" class="back-btn">← Back to Staff</a>
    <h1 class="title">Staff Profile</h1>
</header>

<div class="content">
    <div th:if="${error}" class="message" th:text="${error}"></div>

    <div class="detail-grid">
        <div class="card">
            <div class="label">Full Name</div>
            <div class="value" th:text="${fullName}">N/A</div>
        </div>
        <div class="card">
            <div class="label">Email</div>
            <div class="value" th:text="${email}">N/A</div>
        </div>
        <div class="card">
            <div class="label">Username</div>
            <div class="value" th:text="${username}">N/A</div>
        </div>
        <div class="card">
            <div class="label">Status</div>
            <div class="status" th:classappend="${active} ? ' status-active' : ' status-inactive'" th:text="${active} ? 'Active' : 'Inactive'"></div>
        </div>
        <div class="card" style="grid-column: span 2;">
            <div class="label">Address</div>
            <div class="value" th:text="${address} + ', ' + ${city}">N/A</div>
            <div class="label" style="margin-top:12px;">Phone</div>
            <div class="value" th:text="${phone}">N/A</div>
        </div>
        <div class="card" style="grid-column: span 2;">
            <div class="label">Store</div>
            <div class="value" th:text="${storeLabel}">N/A</div>
        </div>
    </div>

    <div class="actions">
    </div>
</div>
</body>
</html>

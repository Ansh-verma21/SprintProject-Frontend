<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${store != null ? 'Store ' + store.storeId + ' - Detail' : 'Store Detail'}">Store Detail</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream:     #F9F7F7;
            --soft-blue: #DBE2EF;
            --accent:    #3F72AF;
            --accent-dk: #2c5490;
            --text:      #1a2a3a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: var(--soft-blue);
            padding: 18px 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid var(--accent);
        }

        .back-btn {
            text-decoration: none;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--cream);
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.18s, color 0.18s;
        }
        .back-btn:hover { background: var(--accent); color: #fff; }

        header h2 {
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            font-size: 1.35rem;
        }

        .page-wrap {
            max-width: 1060px;
            margin: 40px auto;
            padding: 0 24px 60px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-heading {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .info-card {
            background: var(--soft-blue);
            border-radius: 18px;
            padding: 28px 32px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--cream);
            border-radius: 12px;
            overflow: hidden;
        }

        .info-table th,
        .info-table td {
            padding: 14px 18px;
            text-align: left;
            font-size: 0.88rem;
        }

        .info-table th {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-size: 0.76rem;
            width: 180px;
        }

        .info-table td {
            border-top: 1px solid var(--soft-blue);
            color: var(--text);
        }

        .info-table tr:first-child td,
        .info-table tr:first-child th { border-top: none; }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 12px;
            padding: 20px 24px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<header>
    <a href="javascript:history.back()" class="back-btn">Back</a>
    <h2>Store Detail</h2>
</header>

<div class="page-wrap">

    <div th:if="${error != null}" class="error-box" th:text="${error}">
        Store not found.
    </div>

    <div th:if="${error == null}">
        <div class="section-heading" th:text="${'Store ' + store.storeId}">Store</div>

        <div class="info-card">
            <table class="info-table">
                <tbody>
                <tr>
                    <th>Manager</th>
                    <td th:text="${store.managerName}"></td>
                </tr>
                <tr>
                    <th>Address</th>
                    <td th:text="${store.address}"></td>
                </tr>
                <tr>
                    <th>District</th>
                    <td th:text="${store.district}"></td>
                </tr>
                <tr>
                    <th>City</th>
                    <td th:text="${store.city}"></td>
                </tr>
                <tr>
                    <th>Movies</th>
                    <td th:text="${movieCount}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
